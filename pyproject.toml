[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-document-search"
version = "0.1.0"
description = "Local-first document indexing and full-text search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sharar Masud" }]
requires-python = ">=3.11"
dependencies = ["pypdf>=6", "python-docx>=1", "watchdog>=4"]

[project.optional-dependencies]
gui = ["PySide6>=6.8"]
dev = ["pytest>=8", "pytest-qt>=4.4", "PySide6>=6.8"]

[project.urls]
Homepage = "https://github.com/sha-rar/local-document-search"
Issues = "https://github.com/sha-rar/local-document-search/issues"

[project.scripts]
docsearch = "local_document_search.cli:main"

[project.gui-scripts]
filelens = "local_document_search.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
